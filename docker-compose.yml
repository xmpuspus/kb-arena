services:
  neo4j:
    # Docker Hub has no 5.27 tag; 5.26 is the newest 5.x community line, so
    # this pins the latest patch release on it (checked 2026-09-03).
    image: neo4j:5.26.30-community
    # Neo4j's entrypoint chowns and chmods its whole home directory when it
    # starts as root, which fails under a read-only root. Starting directly
    # as the image's own neo4j user (uid/gid 7474) skips that step.
    user: "7474:7474"
    # Bind to localhost only by default — exposing 7687 to 0.0.0.0 with a default
    # password is how databases get popped on the public internet.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Required: set KB_ARENA_NEO4J_PASSWORD before bringing the stack up.
      # No fallback default — fail-closed.
      - NEO4J_AUTH=neo4j/${KB_ARENA_NEO4J_PASSWORD:?Set KB_ARENA_NEO4J_PASSWORD before starting compose}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    # Starting as the image's own neo4j user (see `user:` above) skips its
    # entrypoint's chown of the whole home directory, which fails read-only.
    # neo4j still writes its startup config, logs, and downloaded plugins
    # outside /data, and the JVM extracts a native library into /tmp and
    # maps it executable, so /tmp needs the exec mount option.
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=200m
      - /logs
      - /var/lib/neo4j/conf
      - /var/lib/neo4j/plugins
      - /var/lib/neo4j/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 1g
    restart: unless-stopped

  api:
    build: .
    # Public-facing: the Dockerfile binds to 0.0.0.0. Demo mode blocks model calls
    # by default, and non-loopback model requests require KB_ARENA_API_TOKEN.
    ports:
      - "8000:8000"
    environment:
      - KB_ARENA_NEO4J_URI=bolt://neo4j:7687
      - KB_ARENA_NEO4J_USER=neo4j
      - KB_ARENA_NEO4J_PASSWORD=${KB_ARENA_NEO4J_PASSWORD:?Set KB_ARENA_NEO4J_PASSWORD}
      - KB_ARENA_NEO4J_DATABASE=${KB_ARENA_NEO4J_DATABASE:-neo4j}
      - KB_ARENA_CHROMA_PATH=/data/chroma
      - KB_ARENA_DATASETS_PATH=/datasets
      - KB_ARENA_RESULTS_PATH=/results
      - KB_ARENA_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - KB_ARENA_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KB_ARENA_API_TOKEN=${KB_ARENA_API_TOKEN:-}
      - KB_ARENA_DEMO_MODE=${KB_ARENA_DEMO_MODE:-true}
      - KB_ARENA_BENCHMARK_COST_CAP_USD=${KB_ARENA_BENCHMARK_COST_CAP_USD:-10.0}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - chroma_data:/data/chroma
      - ./datasets:/datasets
      - ./results:/results
    # Ingest parsers and the optimizer write temp files and per-trial Chroma
    # dirs under /tmp and the kbarena home cache, so both need a tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /home/kbarena
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /ready checks Neo4j and LLM wiring; /health stays for liveness only.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  neo4j_data:
  chroma_data:
