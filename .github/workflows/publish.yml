name: Publish to PyPI

# Trusted publishing on PyPI is not configured for this repo, so the
# release-triggered workflow was failing on every tag. Until OIDC is set up,
# this workflow runs only on manual dispatch and uses an API token from
# repository secrets (PYPI_API_TOKEN). Manual twine upload remains the
# documented path; this workflow is here for when the secret is added.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build, check, and attest without uploading. Use this to prove the
          release path works before a real tag, so the first real publish is
          not the first time these steps ever ran.
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # attest-build-provenance (a wrapper on actions/attest as of v4) mints
      # a Sigstore OIDC token, persists the attestation, and creates the
      # artifact storage record. All three need an explicit grant; none are
      # in the default token permissions.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build==1.6.0 twine==7.0.0 cyclonedx-bom==7.3.1

      - name: Build package
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Generate SBOM
        # cyclonedx-py environment scans whatever Python it is pointed at.
        # Scanning this job's own interpreter would describe the build
        # tools (twine, build, cyclonedx-bom), not the released package, so
        # this installs the actual wheel into a clean venv and scans that.
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --quiet dist/*.whl
          cyclonedx-py environment -o sbom.cdx.json /tmp/sbom-venv/bin/python

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Report the dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run. Every step above ran for real and nothing was uploaded."
          echo "Artifacts built:"
          ls -la dist/
          echo "SBOM components: $(python -c "import json;print(len(json.load(open('sbom.cdx.json')).get('components',[])))")"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set. See README for manual publish steps."
            exit 1
          fi
          twine upload --skip-existing dist/*
