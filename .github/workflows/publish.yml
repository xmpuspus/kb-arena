name: Publish to PyPI

# Trusted publishing on PyPI is not configured for this repo, so the
# release-triggered workflow was failing on every tag. Until OIDC is set up,
# this workflow runs only on manual dispatch and uses an API token from
# repository secrets (PYPI_API_TOKEN). Manual twine upload remains the
# documented path; this workflow is here for when the secret is added.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build, check, and attest without uploading. Use this to prove the
          release path works before a real tag, so the first real publish is
          not the first time these steps ever ran.
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # attest-build-provenance (a wrapper on actions/attest as of v4) mints
      # a Sigstore OIDC token, persists the attestation, and creates the
      # artifact storage record. All three need an explicit grant; none are
      # in the default token permissions.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refuse a real publish from anything but a tag or main
        if: ${{ !inputs.dry_run }}
        run: |
          # workflow_dispatch builds whatever ref the caller selected, so
          # without this anyone who can dispatch could publish a branch under
          # the repository's PyPI token.
          ref="${{ github.ref }}"
          case "$ref" in
            refs/tags/v*|refs/heads/main) echo "Publishing from $ref" ;;
            *) echo "Refusing to publish from $ref. Use a v* tag or main." ; exit 1 ;;
          esac

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build==1.6.0 twine==7.0.0 cyclonedx-bom==7.3.1

      - name: Build package
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Generate SBOM
        # cyclonedx-py environment scans whatever Python it is pointed at.
        # Scanning this job's own interpreter would describe the build
        # tools (twine, build, cyclonedx-bom), not the released package, so
        # this installs the actual wheel into a clean venv and scans that.
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --quiet dist/*.whl
          cyclonedx-py environment -o sbom.cdx.json /tmp/sbom-venv/bin/python

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Report the dry run
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "Dry run. Nothing was uploaded to PyPI."
          echo "Artifacts built:"
          ls -la dist/
          # Not a subshell inside an echo: that hid every failure behind a
          # zero exit and printed an empty count as if it were a real one.
          python - <<'PYEOF'
          import json
          import sys

          with open("sbom.cdx.json") as handle:
              sbom = json.load(handle)
          components = sbom.get("components")
          if not isinstance(components, list) or not components:
              sys.exit("SBOM carries no components. The scan did not describe the package.")
          print(f"SBOM components: {len(components)}")
          names = {str(c.get("name", "")).replace("_", "-") for c in components}
          if "kb-arena" not in names:
              sys.exit("SBOM does not name kb-arena. It scanned the wrong interpreter.")
          print("SBOM names kb-arena.")
          PYEOF
          echo
          echo "This dry run DID persist a build attestation and upload the SBOM"
          echo "artifact, for a build that was never published. That is deliberate:"
          echo "the attestation step is the one most likely to be misconfigured,"
          echo "so it is exercised here rather than first at a release."

      - name: Refuse to republish a version PyPI already holds
        if: ${{ !inputs.dry_run }}
        run: |
          # `--skip-existing` reports success when the version is already on
          # PyPI, so a run that published nothing looked identical to one that
          # published everything, while the attestation above described local
          # files that differ from the released ones.
          # Read the version off the wheel that is about to be uploaded.
          # Importing the package would need its runtime dependencies, and this
          # job installs only the build tools, so the import would fail here and
          # look like a release problem.
          wheel=$(ls dist/*.whl | head -1)
          version=$(basename "$wheel" | cut -d- -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/kb-arena/$version/json")
          if [ "$code" = "200" ]; then
            echo "kb-arena $version is already on PyPI. Bump the version before publishing."
            exit 1
          fi
          echo "kb-arena $version is not on PyPI yet."

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set. See README for manual publish steps."
            exit 1
          fi
          twine upload dist/*
