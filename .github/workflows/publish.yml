name: Publish to PyPI

# Trusted publishing on PyPI is not configured for this repo, so the
# release-triggered workflow was failing on every tag. Until OIDC is set up,
# this workflow runs only on manual dispatch and uses an API token from
# repository secrets (PYPI_API_TOKEN). Manual twine upload remains the
# documented path; this workflow is here for when the secret is added.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build==1.6.0 twine==7.0.0 cyclonedx-bom==7.3.1

      - name: Build package
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set. See README for manual publish steps."
            exit 1
          fi
          twine upload --skip-existing dist/*
