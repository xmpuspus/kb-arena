name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pip install pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/ -v --ignore=tests/live
      # Advisory: a known, unfixable transitive advisory must not fail every
      # PR. --strict would turn this into a hard gate once the repo is clean.
      - run: pip-audit --desc || true

  frontend:
    runs-on: ubuntu-latest
    # npm ci, lint and next build ran in six minutes on 2026-09-04 and in eight
    # on the next branch, and the audit needs up to 155s after them. A ten
    # minute job budget was never sized for that work, so the job was killed
    # mid-audit and reported as "cancelled", which reads like flakiness.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npx next build
      # high/critical only: low/moderate advisories must not fail every PR.
      - name: npm audit, with a retry and a deadline for the registry
        # The binding limit is the JOB timeout, not this one. The job gets 10
        # minutes and npm ci, lint and next build take about six of them, so
        # this step has roughly four minutes to work with. Two earlier versions
        # missed that: one budgeted 330s against a 360s step ceiling, the next
        # budgeted 300s and was killed by the job at ten minutes with the audit
        # still running. A job kill reports as "cancelled", which reads like
        # flakiness rather than a budget that does not fit.
        #
        # Three attempts of 45s with 10s between them is 155s, which fits.
        timeout-minutes: 4
        run: |
          # A vulnerability fails the job. A registry outage does not: the
          # audit endpoint answered "Bad Request" for an hour on 2026-09-04
          # and blocked green pull requests with no finding behind it.
          #
          # The retry below catches an endpoint that ANSWERS an error. It does
          # nothing for one that never answers at all, and that is what
          # happened next: the frontend job was cancelled twice on
          # 2026-09-04 with `npm audit` still running as an orphan process
          # after ten minutes. A cancelled check is not a pass, and it read
          # like flakiness rather than a hang. Each attempt now has a
          # deadline, and the step has one too.
          for attempt in 1 2 3; do
            set +e
            out=$(timeout 45s npm audit --audit-level=high 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            # 124 is what `timeout` returns when it kills the command.
            if [ "$code" -eq 124 ]; then
              echo "registry did not answer within 45s on attempt $attempt, retrying in 10s"
              sleep 10
              continue
            fi
            if ! echo "$out" | grep -q "audit endpoint returned an error"; then
              exit "$code"
            fi
            echo "registry audit endpoint unavailable on attempt $attempt, retrying in 10s"
            sleep 10
          done
          echo "::warning::npm audit skipped: the registry did not answer or errored three times"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/docker-smoke.sh
