- id: "nist-boundary-001"
  tier: 2
  type: boundary
  hops: 1
  split: development
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Tests precise handling of a recategorized control."
  source_anchors: ["sec-sec_03.07.01"]
  question: "Does 03.07.01 state a current requirement for personnel security activities?"
  ground_truth:
    answer: "No. The official text for 03.07.01 states only that it is recategorized as NCO."
    source_refs: ["nist-03.07.01"]
    required_entities: ["03.07.01", "NCO"]
  constraints:
    must_mention: ["Recategorized as NCO"]
    must_not_claim: ["03.07.01 requires a named personnel screening activity"]
    max_tokens: 55

