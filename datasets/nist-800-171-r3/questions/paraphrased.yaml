  tier: 1
  type: paraphrased
  hops: 1
  split: validation
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Tests protected data at rest and in motion."
  source_anchors: [sec-sec_03.13.08]
  question: "What disclosure risk must cryptographic safeguards address for data at rest and in transit?"
  ground_truth:
    answer: "They prevent unauthorized disclosure of CUI during transmission and while in storage."
    source_refs: [nist-03.13.08]
    required_entities: ["03.13.08", "unauthorized disclosure", "CUI"]
  constraints:
