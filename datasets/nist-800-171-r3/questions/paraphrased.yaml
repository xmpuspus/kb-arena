- id: nist-paraphrased-020
  tier: 3
  type: paraphrased
  hops: 1
  split: holdout
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Covers the full supply-chain lifecycle in different wording."
  source_anchors: [sec-sec_03.17.01]
  question: "Across which lifecycle activities must the organization manage supplier-related system risk, and what safeguards apply to that plan?"
  ground_truth:
    answer: "Manage supply-chain risks across research and development, design, manufacturing, acquisition, delivery, integration, operations, maintenance, and disposal; review and update the plan at an organization-defined frequency and protect it from unauthorized disclosure."
    source_refs: [nist-03.17.01]
    required_entities: ["03.17.01", "supply chain risk management plan", "research and development", "disposal"]
  constraints:
    must_mention: ["supply-chain risks", "review and update", "unauthorized disclosure"]
    must_not_claim: ["a particular supplier audit requirement"]
    max_tokens: 70
