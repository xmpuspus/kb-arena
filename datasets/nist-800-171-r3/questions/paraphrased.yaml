  tier: 2
  type: paraphrased
  hops: 1
  split: validation
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Tests the flexible cryptography selection rather than naming an algorithm."
  source_anchors: [sec-sec_03.13.11]
  question: "Who determines the kinds of cryptography used to keep CUI confidential under this requirement?"
