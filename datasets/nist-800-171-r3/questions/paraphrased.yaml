- id: nist-paraphrased-016
  tier: 2
  type: paraphrased
  hops: 1
  split: holdout
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Asks about the defect-to-update workflow without repeating its title."
  source_anchors: [sec-sec_03.14.01]
  question: "What is required after a system defect is found, and how are security-relevant releases handled?"
  ground_truth:
    answer: "Identify, report, and correct system flaws, and install security-relevant software and firmware updates within an organization-defined period after release."
    source_refs: [nist-03.14.01]
    required_entities: ["03.14.01", "system flaws", "security-relevant updates"]
  constraints:
    must_mention: ["identify", "report", "correct", "install"]
    must_not_claim: ["an exact release-to-install duration"]
    max_tokens: 45
- id: nist-paraphrased-017
  tier: 2
  type: paraphrased
  hops: 1
  split: holdout
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Uses organizational communication language for the policy requirement."
  source_anchors: [sec-sec_03.15.01]
  question: "How must an organization make its CUI-protection rules available and keep them current?"
  ground_truth:
    answer: "Develop and document the policies and procedures, disseminate them to organizational personnel or roles, and review and update them at an organization-defined frequency."
    source_refs: [nist-03.15.01]
    required_entities: ["03.15.01", "policies and procedures", "organizational personnel or roles"]
  constraints:
    must_mention: ["disseminate", "review and update"]
    must_not_claim: ["a mandatory publication channel"]
    max_tokens: 45
- id: nist-paraphrased-018
  tier: 3
  type: paraphrased
  hops: 1
  split: holdout
  review_status: machine-assisted-draft
  reviewed_by: "Codex draft pass"
  rationale: "Tests plan content and confidentiality in scenario-neutral language."
  source_anchors: [sec-sec_03.15.02]
  question: "Which system context, responsibilities, and protections belong in the documented security plan?"
  ground_truth:
    answer: "The plan defines components and information types; describes relevant threats, environment, dependencies, requirements, safeguards, and responsible individuals; is reviewed and updated at an organization-defined frequency; and is protected from unauthorized disclosure."
    source_refs: [nist-03.15.02]
    required_entities: ["03.15.02", "system security plan", "system components", "safeguards"]
  constraints:
    must_mention: ["components", "threats", "safeguards", "unauthorized disclosure"]
    must_not_claim: ["that it is a generic corporate policy"]
    max_tokens: 70
